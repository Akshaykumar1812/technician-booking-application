{% extends 'user_page/user_dashboard.html' %}
{% load static %}

{% block user_feedback %}


<div class="feedback-container">

    <!-- Breadcrumbs -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb feedback-breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'user_home' %}">User Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Feedback</li>
        </ol>
    </nav>

    <h2 class="feedback-title">Give Your Feedback</h2>

    <!-- Feedback Form -->
    <form method="POST" class="feedback-form">
        {% csrf_token %}

        <!-- Technician Info (inside form) -->
        <div class="payment-info-header">
            <p><strong>Technician:</strong> {{ technician.full_name }}</p>
            <p><strong>Category:</strong> {{ technician.category }}</p>
        </div>

        <div class="form-group">
            <label for="rating">Rating (1-5)</label>
            <input type="number" id="rating" name="rating" min="1" max="5" value="5" required>
        </div>

        <div class="form-group">
            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Write your feedback here..." required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="feedback-submit-btn">Submit Feedback</button>
        </div>
    </form>


</div>
{% endblock %}
